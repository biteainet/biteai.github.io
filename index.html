<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="renderer" content="webkit">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>比特 AI</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
        html,body{width:100%;height:100%;overflow:hidden}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:radial-gradient(ellipse at 20% 50%,#1a1a2e,#16213e,#0f0f1f);display:flex;justify-content:center;align-items:center;padding:24px}
        .global-bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-999;background-size:cover;background-position:center center;background-repeat:no-repeat}
        .global-video{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-998;object-fit:cover;display:none}
        ::-webkit-scrollbar{width:8px}
        ::-webkit-scrollbar-track{background:rgba(255,255,255,0.03);border-radius:10px}
        ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:10px}
        .app{width:100vw;height:100vh;height:100dvh;max-width:1400px;background:rgba(255,255,255,0.06);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);display:flex;overflow:hidden;position:relative;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,0.6)}
        .sidebar{width:240px;background:rgba(0,0,0,0.22);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-right:1px solid rgba(255,255,255,0.06);display:flex;flex-direction:column;padding:18px;gap:8px}
        .sidebar-title{color:rgba(255,255,255,0.7);font-size:11px;text-transform:uppercase;letter-spacing:2px;font-weight:600;margin-bottom:8px;padding-left:4px}
        .role-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;cursor:pointer;transition:all .25s ease;margin-bottom:4px;background:transparent}
        .role-item:active{background:rgba(255,255,0.1)}
        .role-item:hover{background:rgba(255,255,255,0.04)}
        .role-item.active{background:rgba(255,255,0.12);box-shadow:0 2px 12px rgba(0,0,0,0.2)}
        .role-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;color:#fff;flex-shrink:0;background:linear-gradient(135deg,#a29bfe,#6c5ce7)}
        .role-avatar img{width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0}
        .role-avatar .avatar-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
        .role-avatar:hover .avatar-overlay{opacity:1}
        .role-avatar.green{background:linear-gradient(135deg,#00b894,#55efc4);box-shadow:0 2px 8px rgba(0,184,148,0.3)}
        .role-avatar.pink{background:linear-gradient(135deg,#fd79a8,#e84393);box-shadow:0 2px 8px rgba(253,121,168,0.3)}
        .role-avatar.blue{background:linear-gradient(135deg,#74b9ff,#0984e3);box-shadow:0 2px 8px rgba(116,185,255,0.3)}
        .role-avatar.purple{background:linear-gradient(135deg,#a29bfe,#6c5ce7);box-shadow:0 2px 8px rgba(162,155,254,0.3)}
        .role-info{flex:1;min-width:0}
        .role-name{color:rgba(255,255,255,0.9);font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .role-desc{color:rgba(255,255,255,0.4);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
        .role-delete{opacity:0;color:rgba(255,255,255,0.3);cursor:pointer;font-size:14px;transition:all .2s;padding:4px 6px;border-radius:6px;line-height:1}
        .role-item:hover .role-delete{opacity:1}
        .role-delete:hover{color:#ff6b6b;background:rgba(255,107,107,0.15)}
        .add-role-btn{margin-top:12px;padding:12px;border:1px dashed rgba(255,255,255,0.12);border-radius:14px;background:transparent;color:rgba(255,255,255,0.5);font-size:12px;cursor:pointer}
        .add-role-btn:active,.add-role-btn:hover{border-color:rgba(255,255,255,0.2);color:rgba(255,255,255,0.85);background:rgba(255,255,255,0.02)}
        .bg-set-btn,.bg-reset-btn,.import-chat-btn{margin-top:8px;padding:10px;border:1px solid rgba(255,255,255,0.12);border-radius:14px;background:transparent;color:rgba(255,255,255,0.5);font-size:13px;cursor:pointer}
        .import-chat-btn{border-color:rgba(100,200,255,0.25);color:rgba(100,200,255,0.7)}
        .bg-reset-btn{border-color:rgba(255,120,120,0.25);color:rgba(255,150,150,0.6)}
        .bg-set-btn:active,.bg-set-btn:hover,.bg-reset-btn:active,.bg-reset-btn:hover,.import-chat-btn:active,.import-chat-btn:hover{border-color:rgba(255,255,255,0.2);color:rgba(255,255,255,0.85)}
        .import-chat-btn.disabled{opacity:0.4;pointer-events:none;cursor:not-allowed}
        .main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%;position:relative}
        .header{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;min-height:72px}
        .menu-btn{display:none;width:36px;height:36px;background:rgba(255,255,255,0.08);border:none;border-radius:8px;color:#fff;font-size:18px;cursor:pointer;align-items:center;justify-content:center}
        .header-left{display:flex;align-items:center;gap:14px}
        .brand{color:#fff;font-size:18px;font-weight:700;letter-spacing:-.3px;background:linear-gradient(135deg,#a29bfe,#6c5ce7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .brand span{font-weight:300;opacity:0.5;-webkit-text-fill-color:rgba(255,255,255,0.3)}
        .header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
        .model-select{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.10);color:rgba(255,255,255,0.85);padding:8px 14px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer}
        .model-select:hover{background-color:rgba(255,255,255,0.12)}
        .model-select option{background:#1e1e2f;color:#fff}
        .clear-history-btn{background:rgba(255,80,80,0.15);border:1px solid rgba(255,100,100,0.3);color:#ff9494;padding:8px 14px;border-radius:20px;font-size:12px;cursor:pointer;transition:.3s}
        .clear-history-btn:active,.clear-history-btn:hover{background:rgba(255,80,80,0.25)}
        .video-volume-btn{background:rgba(100,180,255,0.15);border:1px solid rgba(100,180,255,0.3);color:#a0d8ff;padding:8px 12px;border-radius:20px;font-size:12px;cursor:pointer;transition:.3s}
        .video-volume-btn:active,.video-volume-btn:hover{background:rgba(100,180,255,0.25)}
        .music-toggle-btn{background:rgba(100,200,150,0.15);border:1px solid rgba(100,200,150,0.3);color:#a0e0c0;padding:8px 12px;border-radius:20px;font-size:12px;cursor:pointer;transition:.3s}
        .music-toggle-btn.muted{color:#ff9494;border-color:rgba(255,100,100,0.3);background:rgba(255,80,80,0.15)}
        .chat-area{flex:1;overflow-y:auto;padding:20px 24px 12px;display:flex;flex-direction:column;gap:12px;position:relative}
        .message{max-width:75%;padding:14px 20px;border-radius:18px;font-size:14px;line-height:1.6;animation:msgIn .35s cubic-bezier(.16,1,.3,1);word-wrap:break-word;position:relative;color:rgba(255,255,255,0.9);background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.03)}
        .message .action-text{opacity:0.5}
        .message a{color:#a29bfe;text-decoration:underline;cursor:pointer;word-break:break-all}
        @keyframes msgIn{0%{opacity:0;transform:scale(.92) translateY(12px)}100%{opacity:1;transform:scale(1) translateY(0)}}
        @keyframes msgOut{0%{opacity:1;transform:scale(1) translateY(0)}100%{opacity:0;transform:scale(.92) translateY(-12px)}}
        .message.removing{animation:msgOut .25s cubic-bezier(.16,1,.3,1) forwards}
        .message.user{align-self:flex-end;background:rgba(108,92,231,0.35);border:1px solid rgba(108,92,231,0.25);border-bottom-right-radius:4px;color:#fff}
        .message.assistant{align-self:flex-start;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.04);border-bottom-left-radius:4px}
        .message.system{align-self:center;background:rgba(255,200,50,0.08);border:1px solid rgba(255,200,50,0.12);color:rgba(255,200,50,0.85);border-radius:20px;max-width:90%;font-size:13px;padding:10px 14px}
        .message .msg-role{font-size:10px;font-weight:600;opacity:0.4;letter-spacing:.5px;margin-bottom:4px;text-transform:uppercase}
        .message .content{white-space:pre-wrap}
        .message .content .cursor-blink{display:inline-block;width:2px;height:1em;background:rgba(255,255,0.5);margin-left:2px;animation:blink .8s step-end infinite;vertical-align:text-bottom}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
        .msg-version-bar{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11px;color:rgba(255,255,255,0.25);justify-content:flex-end;opacity:0;transition:opacity .25s}
        .msg-version-bar.visible{opacity:1}
        .msg-version-bar .v-arrow{cursor:pointer;padding:2px 4px;border-radius:4px;transition:all .2s;color:rgba(255,255,255,0.4);font-size:12px;line-height:1;user-select:none}
        .msg-version-bar .v-arrow:hover:not(.disabled){background:rgba(255,255,255,0.08)}
        .msg-version-bar .v-arrow.disabled{opacity:0.25;cursor:not-allowed;pointer-events:none}
        .msg-version-bar .v-index{font-weight:500;color:rgba(255,255,255,0.35);font-size:11px;min-width:28px;text-align:center}
        .context-menu{position:fixed;background:rgba(30,30,50,0.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:6px}
        .context-menu.show{display:block}
        .context-menu.closing{animation:menuFadeOut .18s cubic-bezier(.16,1,.3,1) forwards}
        @keyframes menuFadeIn{0%{opacity:0;transform:scale(.95) translateY(4px)}100%{opacity:1;transform:scale(1) translateY(0)}}
        @keyframes menuFadeOut{0%{opacity:1;transform:scale(1) translateY(0)}100%{opacity:0;transform:scale(.95) translateY(4px)}}
        .context-menu .menu-item{display:flex;align-items:center;gap:10px;padding:8px 18px;color:rgba(255,255,255,0.75);font-size:13px;cursor:pointer;transition:background .15s;font-family:inherit}
        .context-menu .menu-item:hover{background:rgba(255,255,255,0.06)}
        .context-menu .menu-item svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;opacity:0.5}
        .context-menu .menu-item.danger{color:#ff6b6b}
        .context-menu .menu-item.danger:hover{background:rgba(255,107,107,0.1)}
        .context-menu .menu-divider{height:1px;background:rgba(255,255,255,0.05);margin:4px 12px}
        .input-area{flex-shrink:0;position:relative;background:rgba(0,0,0,0.15);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid rgba(255,255,255,0.05);padding:10px 16px}
        .input-area.panel-open{transform:translateY(-160px)}
        .search-row{display:flex;align-items:center;gap:10px;padding:0 4px 4px 4px}
        .search-toggle{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 10px 4px 6px;border-radius:16px;background:rgba(255,255,255,0.04)}
        .search-toggle .track{width:36px;height:20px;border-radius:12px;background:rgba(255,255,255,0.15);transition:all .3s;position:relative;flex-shrink:0;border:2px solid rgba(255,255,255,0.08)}
        .search-toggle .track.active{background:linear-gradient(135deg,#6c5ce7,#a29bfe);border-color:#6c5ce7;box-shadow:0 0 20px rgba(108,92,231,0.3)}
        .search-toggle .thumb{width:14px;height:14px;border-radius:50%;background:#fff;position:absolute;top:1px;left:1px;transition:all .3s;box-shadow:0 1px 4px rgba(0,0,0,0.2)}
        .search-toggle .thumb.active{left:17px}
        .search-toggle .label{color:rgba(255,255,255,0.4);font-size:11px;font-weight:500;transition:all .3s;white-space:nowrap}
        .search-toggle .label.active{color:rgba(162,155,254,0.9)}
        .search-status{color:rgba(162,155,254,0.5);font-size:10px;padding-left:4px;transition:all .3s;min-height:16px}
        .search-status.active{color:rgba(162,155,254,0.8)}
        .input-row{display:flex;gap:12px;align-items:flex-end;position:relative}
        .input-row textarea{flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:12px 18px;color:rgba(255,255,255,0.9);font-size:13px;font-family:inherit;resize:none;min-height:48px;max-height:160px}
        .input-row textarea:focus{border-color:rgba(108,92,231,0.4);background:rgba(255,255,255,0.08);box-shadow:0 0 20px rgba(108,92,231,0.05)}
        .action-btn{width:48px;height:48px;border-radius:50%;border:none;background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.6);cursor:pointer;transition:all .3s;display:flex;align-items:center;justify-content:center}
        .action-btn:hover{background:rgba(255,255,255,0.12)}
        .action-btn:active{transform:scale(.94)}
        .action-btn.active{background:rgba(108,92,231,0.2);color:#a29bfe}
        .action-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
        .send-btn{width:48px;height:48px;border-radius:50%;border:none;background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff;font-size:18px;cursor:pointer;transition:all .3s;display:flex;align-items:center;justify-content:center}
        .send-btn:hover{transform:scale(1.04);box-shadow:0 6px 24px rgba(108,92,231,0.4)}
        .send-btn:active{transform:scale(.94)}
        .send-btn svg{width:20px;height:20px;fill:currentColor}
        .hold-talk-btn{width:48px;height:48px;border-radius:50%;border:none;background:rgba(255,80,80,0.2);color:#ff6b6b;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;flex-shrink:0;display:none;align-items:center;justify-content:center}
        .hold-talk-btn.show{display:flex}
        .hold-talk-btn.recording{background:rgba(255,80,80,0.35);transform:scale(1.08);box-shadow:0 0 30px rgba(255,80,80,0.2)}
        .plus-btn{position:relative;z-index:21;transition:transform .3s cubic-bezier(.16,1,.3,1)}
        .plus-btn.open{transform:rotate(45deg)}
        .plus-panel-wrapper{position:absolute;bottom:0;left:0;right:0;z-index:19;transform:translateY(100%);transition:transform .3s cubic-bezier(.16,1,.3,1);pointer-events:none;overflow:visible;padding:12px 20px}
        .plus-panel-wrapper.open{transform:translateY(0);pointer-events:auto}
        .plus-panel{background:rgba(30,30,50,0.96);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:20px 20px 0 0;border:1px solid rgba(255,255,255,0.06);border-bottom:none;padding:12px}
        .plus-panel-inner{display:flex;flex-direction:row;justify-content:space-around;gap:8px;flex-wrap:wrap}
        .plus-panel-btn{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:16px;color:rgba(255,255,255,0.85);padding:12px 8px;font-size:12px;font-weight:500;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
        .plus-panel-btn:hover{background:rgba(255,255,255,0.08)}
        .plus-panel-btn:active{transform:scale(.95)}
        .plus-panel-btn .panel-icon{width:28px;height:28px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
        .plus-panel-btn .panel-label{font-size:11px;color:rgba(255,255,255,0.6);line-height:1.2}
        .modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center}
        .modal-overlay.open{display:flex}
        @keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
        .modal{background:rgba(30,30,50,0.92);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:28px;padding:32px 36px;width:420px;max-width:100%;border:1px solid rgba(255,255,255,0.08)}
        @keyframes modalPop{0%{transform:scale(.92) translateY(20px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
        .modal h3{color:#fff;font-size:18px;font-weight:600;margin-bottom:20px;letter-spacing:-.2px}
        .modal label{color:rgba(255,255,255,0.5);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;display:block;margin-top:16px;margin-bottom:5px}
        .modal input,.modal textarea{width:100%;padding:10px 14px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:14px;color:rgba(255,255,255,0.9);font-size:13px;font-family:inherit}
        .modal input:focus,.modal textarea:focus{border-color:rgba(108,92,231,0.4);background:rgba(255,255,255,0.08)}
        .modal textarea{resize:vertical;min-height:60px}
        .modal .avatar-preview{width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,0.05);margin:8px auto 12px;overflow:hidden;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,0.04)}
        .modal .avatar-preview img{width:100%;height:100%;object-fit:cover}
        .modal .avatar-upload-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
        .modal .avatar-upload-row input[type="file"]{flex:1;padding:6px;font-size:11px;background:rgba(255,255,255,0.04);border:1px dashed rgba(255,255,255,0.15);border-radius:10px;color:rgba(255,255,255,0.8)}
        .modal .avatar-upload-row input[type="text"]{flex:2;padding:8px 12px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:10px;color:rgba(255,255,255,0.8)}
        .modal .color-options{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}
        .modal .color-dot{width:32px;height:32px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .25s}
        .modal .color-dot:hover{transform:scale(1.08)}
        .modal .color-dot.selected{border-color:#fff;box-shadow:0 0 16px rgba(255,255,0.2)}
        .modal-actions{display:flex;gap:10px;margin-top:24px;justify-content:flex-end}
        .modal-actions button{padding:9px 24px;border-radius:16px;border:none;font-size:13px;font-weight:500;cursor:pointer;transition:all .25s;font-family:inherit}
        .modal-actions .btn-cancel{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.5)}
        .modal-actions .btn-cancel:hover{background:rgba(255,255,255,0.12)}
        .modal-actions .btn-confirm{background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff;box-shadow:0 4px 16px rgba(108,92,231,0.3)}
        .modal-actions .btn-confirm:hover{transform:scale(1.03)}
        .empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:rgba(255,255,255,0.15);font-size:14px;gap:8px}
        .empty-state svg{opacity:0.2;width:48px;height:48px}
        .file-input-hidden{display:none}
        .sidebar-mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9}
        .progress-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center}
        .progress-overlay.open{display:flex}
        .progress-box{background:rgba(30,30,50,0.95);border-radius:20px;padding:30px 40px;width:380px;max-width:90%;border:1px solid rgba(255,255,255,0.08);text-align:center}
        .progress-box h4{color:rgba(255,255,255,0.9);font-size:16px;font-weight:500;margin-bottom:10px}
        .progress-box p{color:rgba(255,255,255,0.5);font-size:13px;margin-bottom:16px}
        .progress-track{width:100%;height:8px;background:rgba(255,255,255,0.08);border-radius:10px;overflow:hidden}
        .progress-bar{height:100%;width:0%;background:linear-gradient(90deg,#6c5ce7,#a29bfe);border-radius:10px;transition:width .3s ease}
        .progress-text{color:rgba(255,255,255,0.4);font-size:12px;margin-top:10px}
        .error-msg{background:rgba(255,80,80,0.15);border:1px solid rgba(255,80,80,0.3);color:#ff6b6b;padding:12px 16px;border-radius:12px;font-size:13px;margin:4px 0}
        .settings-page{position:fixed;top:0;left:0;width:100%;height:100%;z-index:2000;background:rgba(0,0,0,0.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:none;flex-direction:column}
        .settings-page.open{display:flex}

        .settings-support-btn{margin-top:18px;padding:12px;border:1px solid rgba(100,200,255,0.25);border-radius:16px;background:rgba(100,200,255,0.08);color:rgba(100,200,255,0.9);font-size:14px;cursor:pointer}
        .settings-support-btn:hover{background:rgba(100,200,255,0.18);border-color:rgba(100,200,255,0.4)}
        .settings-update-btn{margin-top:12px;padding:12px;border:1px solid rgba(255,255,255,0.1);border-radius:14px;background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.6);font-size:13px;cursor:pointer}
        .settings-update-btn:hover{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.8)}
        .update-page{position:fixed;top:0;left:0;width:100%;height:100%;z-index:2100;background:rgba(0,0,0,0.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:none;flex-direction:column}
        .update-page.open{display:flex}
        .update-header{display:flex;align-items:center;padding:16px 20px;background:rgba(255,255,255,0.04);border-bottom:1px solid rgba(255,255,255,0.06);flex-shrink:0;min-height:60px}
        .update-back{background:none;border:none;color:rgba(255,255,255,0.8);font-size:16px;cursor:pointer;padding:6px 12px;display:flex;align-items:center;gap:6px;font-family:inherit}
        .update-back:hover{color:#fff}
        .update-back svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
        .update-title{flex:1;text-align:center;color:rgba(255,255,255,0.9);font-size:17px;font-weight:500;letter-spacing:.3px}
        .update-body{flex:1;overflow-y:auto;padding:20px 24px 30px}
        .update-item{color:rgba(255,255,255,0.75);font-size:14px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
        .update-item .date{color:rgba(255,255,255,0.3);font-size:12px;display:inline-block;min-width:100px}
        .update-empty{color:rgba(255,255,255,0.3);text-align:center;padding:40px 0}
        .pay-page{position:fixed;top:0;left:0;width:100%;height:100%;z-index:2200;background:rgba(0,0,0,0.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:none;flex-direction:column}
        .pay-page.open{display:flex}
        .pay-header{display:flex;align-items:center;padding:16px 20px;background:rgba(255,255,255,0.04);border-bottom:1px solid rgba(255,255,255,0.06);flex-shrink:0;min-height:60px}
        .pay-back{background:none;border:none;color:rgba(255,255,255,0.8);font-size:16px;cursor:pointer;padding:6px 12px;display:flex;align-items:center;gap:6px;font-family:inherit}
        .pay-back:hover{color:#fff}
        .pay-back svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
        .pay-title{flex:1;text-align:center;color:rgba(255,255,255,0.9);font-size:17px;font-weight:500;letter-spacing:.3px}
        .pay-body{flex:1;overflow-y:auto;padding:30px 24px;display:flex;flex-direction:column;align-items:center}
        .pay-qr{width:220px;height:220px;background:rgba(255,255,255,0.05);border-radius:16px;object-fit:contain;margin-bottom:16px}

        .settings-gear-btn{background:transparent;border:none;padding:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0.7;transition:opacity .2s}

        .undercover-banner{background:rgba(255,200,50,0.12);border:1px solid rgba(255,200,50,0.2);border-radius:14px;padding:10px 16px;margin-bottom:8px;text-align:center;color:rgba(255,200,50,0.9)}

        .group-chat-tab.active{background:rgba(108,92,231,0.2);border-color:rgba(108,92,231,0.3);color:rgba(255,255,255,0.9)}

        .victory-stats .stat-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:13px;color:rgba(255,255,255,0.7)}
        .victory-stats .stat-row .stat-label{color:rgba(255,255,255,0.4)}

        .at-suggest .at-item{padding:8px 14px;color:rgba(255,255,255,0.8);font-size:13px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:background .15s}
        .at-suggest .at-item:hover{background:rgba(255,255,255,0.06)}

        .at-suggest .at-item .at-name{font-weight:500}
        .undercover-select-modal .modal{max-width:480px}
        .undercover-select-modal .role-select-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;cursor:pointer;transition:all .2s;background:rgba(255,255,255,0.03);margin-bottom:4px}
        .undercover-select-modal .role-select-item:hover{background:rgba(255,255,255,0.06)}
        .undercover-select-modal .role-select-item.selected{background:rgba(108,92,231,0.2);border:1px solid rgba(108,92,231,0.3)}
        .undercover-select-modal .role-select-item .rs-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;flex-shrink:0}
        .undercover-select-modal .role-select-item .rs-name{color:rgba(255,255,255,0.9);font-size:13px;font-weight:500;flex:1}
        .undercover-select-modal .role-select-item .rs-check{color:rgba(108,92,231,0.6);font-size:18px}
        .werewolf-overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:3000;background:rgba(0,0,0,0.95);display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 1.2s ease}
        .werewolf-overlay.show{opacity:1;pointer-events:auto}
        .werewolf-overlay .ww-text{color:rgba(255,255,255,0.9);font-size:28px;font-weight:600;letter-spacing:4px;text-shadow:0 0 40px rgba(255,200,50,0.15)}
        .werewolf-overlay .ww-sub{color:rgba(255,255,255,0.3);font-size:14px;margin-top:12px;letter-spacing:2px}
        .werewolf-overlay .ww-loader{width:40px;height:40px;border:3px solid rgba(255,255,255,0.05);border-top-color:rgba(255,200,50,0.6);border-radius:50%;animation:wwSpin 0.8s linear infinite;margin-top:20px}
        @keyframes wwSpin{to{transform:rotate(360deg)}}
        .werewolf-overlay.fade-out{opacity:0;pointer-events:none;transition:opacity 1.5s ease}
        .werewolf-role-reveal{position:fixed;top:0;left:0;width:100%;height:100%;z-index:3001;background:rgba(0,0,0,0.85);display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.8s ease}
        .werewolf-role-reveal.show{opacity:1;pointer-events:auto}
        .werewolf-role-reveal .role-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:24px;padding:30px 40px;text-align:center;max-width:320px;width:90%}
        .werewolf-role-reveal .role-card .rc-title{color:rgba(255,255,255,0.3);font-size:12px;letter-spacing:3px;text-transform:uppercase}
        .werewolf-role-reveal .role-card .rc-role{color:#fff;font-size:32px;font-weight:700;margin:12px 0 8px}
        .werewolf-role-reveal .role-card .rc-desc{color:rgba(255,255,255,0.4);font-size:14px}
        .werewolf-role-reveal .role-card .rc-btn{margin-top:18px;padding:10px 30px;border-radius:16px;border:none;background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit}
        .werewolf-role-reveal .role-card .rc-btn:active{transform:scale(.95)}
        .ww-status-badge{position:fixed;top:10px;right:10px;z-index:4000;background:rgba(0,0,0,0.6);backdrop-filter:blur(8px);border-radius:12px;padding:4px 12px;font-size:10px;color:rgba(255,255,255,0.85);border:1px solid rgba(255,255,255,0.06)}
        .ww-status-badge.loaded{color:rgba(100,200,150,0.8);border-color:rgba(100,200,150,0.2)}
        .ww-status-badge.error{color:rgba(255,100,100,0.8);border-color:rgba(255,100,100,0.2)}
        .input-row .file-preview-btn{width:48px;height:48px;border-radius:50%;border:none;background:rgba(100,200,255,0.1);color:rgba(100,200,255,0.6);cursor:pointer;transition:all .3s;display:flex;align-items:center;justify-content:center}
        .input-row .file-preview-btn:hover{background:rgba(100,200,255,0.2);color:rgba(100,200,255,0.9)}
        .input-row .file-preview-btn:active{transform:scale(.94)}
        .input-row .file-preview-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
        .preset-music-row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
        .preset-music-row input[type="text"]{flex:1;padding:8px 12px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:10px;color:rgba(255,255,255,0.8);font-size:13px}
        .preset-music-row .btn-small{padding:6px 14px;border-radius:10px;border:none;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .2s}
        .preset-music-row .btn-small.confirm{background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff}
        .preset-music-row .btn-small.cancel{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.5)}
        .preset-music-row .btn-small.confirm:hover{transform:scale(1.03)}
        @media (max-width:1024px){.app{padding:12px}.sidebar{width:200px;padding:12px}.main{padding:0}.chat-area{padding:16px}}
        @media (max-width:768px){.menu-btn{display:flex}.sidebar{position:fixed;left:0;top:0;height:100vh;height:100dvh;transform:translateX(-100%);width:200px}.sidebar.show{transform:translateX(0)}.sidebar-mask{display:block}.sidebar{z-index:30}}
        @media (max-width:480px){.sidebar{width:180px;padding:10px 6px}.role-item{padding:8px;gap:6px}.role-avatar{width:28px;height:28px;font-size:10px}.role-name{font-size:10px}.role-desc{display:none}.input-row textarea{min-height:40px}}

</head>
<body>
    <div class="global-bg" id="globalBg"></div>
    <video class="global-video" id="globalVideo" autoplay loop muted playsinline></video>
    <div class="ww-status-badge" id="wwStatusBadge">JSON 加载中...</div>
    <div class="app" id="app">
        <div class="sidebar-mask" id="sidebarMask"></div>
        <div class="sidebar" id="sidebar">
            <div class="sidebar-title">角色</div>
            <div id="roleList"></div>
            <button class="add-role-btn" id="addRoleBtn">+ 添加角色</button>
            <button class="import-chat-btn disabled" id="importChatBtn">导入聊天记录</button>
            <button class="bg-set-btn" id="bgSetBtn">上传背景(图/GIF/视频/SVG)</button>
            <button class="bg-reset-btn" id="bgResetBtn">重置默认背景</button>
        </div>
        <div class="main">
            <div class="header">
                <div class="header-left">
                    <button class="menu-btn" id="menuBtn">☰</button>
                    <div class="brand">比特 AI <span>·</span></div>
                </div>
                <div class="header-right">
                    <button class="settings-gear-btn" id="settingsGearBtn">
                        <img src="sezhi.svg" alt="设置">
                    </button>
                    <select class="model-select" id="modelSelect">
                        <option value="deepseek-v4-pro">Deepseek V4 Pro</option>
                        <option value="deepseek-v4-flash">Deepseek V4 Flash</option>
                    </select>
                    <button class="music-toggle-btn" id="musicToggleBtn">静音</button>
                    <button class="clear-history-btn" id="clearHistoryBtn">一键重聊</button>
                    <button class="video-volume-btn" id="videoVolumeBtn">开启声音</button>
                </div>
            </div>
            <div class="chat-area" id="chatArea">
                <div class="empty-state" id="emptyState">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/><path d="M12 6v6l4 2"/></svg>
                    <span>开始对话吧</span>
                </div>
            </div>
            <div class="input-area" id="inputArea">
                <div class="search-row">
                    <div class="search-toggle" id="searchToggle">
                        <div class="track" id="searchTrack"><div class="thumb" id="searchThumb"></div></div>
                        <span class="label" id="searchLabel">联网搜索</span>
                        <span class="search-status" id="searchStatus">已关闭</span>
                    </div>
                </div>
                <div class="input-row" style="position:relative">
                    <textarea id="msgInput" rows="1" maxlength="4000" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
                    <button class="action-btn plus-btn" id="plusBtn">
                        <svg viewBox="0 0 24 24" id="plusIcon"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
                    </button>
                    <button class="hold-talk-btn" id="holdTalkBtn">按住说话</button>
                    <button class="send-btn" id="sendBtn">
                        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                    </button>
                    <div class="at-suggest" id="atSuggest"></div>
                </div>
                <div class="plus-panel-wrapper" id="plusPanelWrapper">
                    <div class="plus-panel" id="plusPanel">
                        <div class="plus-panel-inner">
                            <button class="plus-panel-btn" id="plusBgSetBtn">
                                <svg class="panel-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                                <span class="panel-label">设置背景</span>
                            </button>
                            <button class="plus-panel-btn" id="plusMusicSetBtn">
                                <svg class="panel-icon" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                                <span class="panel-label">背景音乐</span>
                            </button>
                            <button class="plus-panel-btn" id="plusGroupChatBtn">
                                <svg class="panel-icon" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
                                <span class="panel-label">群聊管理</span>
                            </button>
                            <button class="plus-panel-btn" id="plusUndercoverBtn">
                                <svg class="panel-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/><path d="M12 11l2 3-2 3-2-3z"/></svg>
                                <span class="panel-label">谁是卧底</span>
                            </button>
                            <button class="plus-panel-btn" id="plusWerewolfBtn">
                                <svg class="panel-icon" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5"/></svg>
                                <span class="panel-label">狼人杀（测试版）</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="context-menu" id="contextMenu">
        <button class="menu-item" data-action="withdraw"><svg viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>撤回</button>
        <button class="menu-item" data-action="edit"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>编辑</button>
        <div class="menu-divider"></div>
        <button class="menu-item" data-action="redo"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9"/><path d="M21 3v6h-6"/></svg>重新输出</button>
        <button class="menu-item" data-action="edit_ai"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>修改</button>
    </div>

    <div class="modal-overlay" id="roleModal">
        <div class="modal">
            <h3 id="roleModalTitle">新建角色</h3>
            <label>姓名</label>
            <input id="roleNameInput" maxlength="12">
            <label>性格描述</label>
            <textarea id="roleDescInput"></textarea>
            <label>头像</label>
            <div class="avatar-preview" id="avatarPreview"><span style="color:rgba(255,255,255,0.2);font-size:12px">无头像</span></div>
            <div class="avatar-upload-row">
                <input type="file" id="avatarFileInput" accept="image/png,image/jpeg,image/webp">
                <input type="text" id="avatarLinkInput" placeholder="或输入图片链接">
            </div>
            <label>头像颜色</label>
            <div class="color-options" id="colorOptions">
                <div class="color-dot selected" data-color="purple" style="background:linear-gradient(135deg,#a29bfe,#6c5ce7)"></div>
                <div class="color-dot" data-color="green" style="background:linear-gradient(135deg,#55efc4,#00b894)"></div>
                <div class="color-dot" data-color="pink" style="background:linear-gradient(135deg,#fd79a8,#e84393)"></div>
                <div class="color-dot" data-color="blue" style="background:linear-gradient(135deg,#74b9ff,#0984e3)"></div>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" id="roleModalCancel">取消</button>
                <button class="btn-confirm" id="roleModalConfirm">确认</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="groupModal">
        <div class="modal">
            <h3 id="groupModalTitle">群聊管理</h3>
            <div id="groupList"></div>
            <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap">
                <button class="btn-confirm" id="groupCreateBtn" style="flex:1;padding:10px;border-radius:14px;border:none;background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff;font-size:13px">新建</button>
                <button class="btn-cancel" id="groupModalClose" style="flex:1;padding:10px;border-radius:14px;border:none;background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.5);font-size:13px">关闭</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="groupDetailModal">
        <div class="modal">
            <h3 id="groupDetailTitle">群聊</h3>
            <label>群名称</label>
            <input id="groupNameInput" maxlength="20">
            <label>群头像</label>
            <div class="avatar-preview" id="groupAvatarPreview"><span style="color:rgba(255,255,255,0.2);font-size:12px">无头像</span></div>

        function openMusicDB() {
            return new Promise(function(resolve, reject) {
                var req = indexedDB.open('BitAIMusicDB', 1);
                req.onupgradeneeded = function(e) {
                    var db = e.target.result;
                    if (!db.objectStoreNames.contains('musicStore')) {
                        db.createObjectStore('musicStore', { keyPath: 'id' });
                    }
                };
                req.onsuccess = function(e) { resolve(e.target.result); };
                req.onerror = function(e) { reject(e.target.error); };
            });
        }

        function initMusicDB() {
            openMusicDB().then(function(db) {
                musicDB = db;

        function saveMusicToDB(id, fileData, fileName, fileType) {
            return new Promise(function(resolve, reject) {
                if (!musicDB) {
                    reject(new Error('IndexedDB not ready'));
                    return;
                }
                var tx = musicDB.transaction(['musicStore'], 'readwrite');
                var store = tx.objectStore('musicStore');
                var record = { id: id, data: fileData, name: fileName, type: fileType, updated: Date.now() };
                var req = store.put(record);
                req.onsuccess = function(e) { resolve(); };
                req.onerror = function(e) { reject(e.target.error); };
            });
        }

        function getMusicFromDB(id) {
            return new Promise(function(resolve, reject) {
                if (!musicDB) {
                    reject(new Error('IndexedDB not ready'));
                    return;
                }
                var tx = musicDB.transaction(['musicStore'], 'readonly');
                var store = tx.objectStore('musicStore');
                var req = store.get(id);
                req.onsuccess = function(e) {
                    resolve(e.target.result || null);
                };
                req.onerror = function(e) {
                    reject(e.target.error);
                };
            });
        }

        function deleteMusicFromDB(id) {
            return new Promise(function(resolve, reject) {
                if (!musicDB) {
                    reject(new Error('IndexedDB not ready'));
                    return;
                }
                var tx = musicDB.transaction(['musicStore'], 'readwrite');
                var store = tx.objectStore('musicStore');
                var req = store.delete(id);
                req.onsuccess = function(e) { resolve(); };
                req.onerror = function(e) { reject(e.target.error); };
            });
        }

        function openCacheDB() {
            return new Promise(function(resolve, reject) {
                var req = indexedDB.open('BitAICache', 1);
                req.onupgradeneeded = function(e) {
                    var db = e.target.result;
                    if (!db.objectStoreNames.contains('bgCache')) {
                        db.createObjectStore('bgCache', { keyPath: 'roleId' });
                    }
                };
                req.onsuccess = function(e) { resolve(e.target.result); };
                req.onerror = function(e) { reject(e.target.error); };
            });
        }

        function initCache() {
            openCacheDB().then(function(db) {
                cacheDB = db;
            }).catch(function() {});
            initMusicDB();
        }

        function getCachedBg(roleId) {
            return new Promise(function(resolve, reject) {
                if (!cacheDB) { resolve(null); return; }
                var tx = cacheDB.transaction(['bgCache'], 'readonly');
                var store = tx.objectStore('bgCache');
                var req = store.get(roleId);
                req.onsuccess = function(e) { resolve(e.target.result || null); };
                req.onerror = function(e) { reject(e.target.error); };
            });
        }

        function putCachedBg(roleId, type, data) {
            return new Promise(function(resolve, reject) {
                if (!cacheDB) { resolve(); return; }
                var tx = cacheDB.transaction(['bgCache'], 'readwrite');
                var store = tx.objectStore('bgCache');
                var req = store.put({ roleId: roleId, type: type, data: data });
                req.onsuccess = function(e) { resolve(); };
                req.onerror = function(e) { reject(e.target.error); };
            });
        }

        function deleteCachedBg(roleId) {
            return new Promise(function(resolve, reject) {
                if (!cacheDB) { resolve(); return; }
                var tx = cacheDB.transaction(['bgCache'], 'readwrite');
                var store = tx.objectStore('bgCache');
                var req = store.delete(roleId);
                req.onsuccess = function(e) { resolve(); };
                req.onerror = function(e) { reject(e.target.error); };
            });
        }

        function applyBgFromCache(roleId) {
            getCachedBg(roleId).then(function(cached) {
                if (cached) {
                    if (cached.type === 'image') {
                        globalBg.style.backgroundImage = 'url(' + cached.data + ')';
                        globalVideo.style.display = 'none';
                        videoVolumeBtn.style.display = 'none';
                        globalVideo.pause();
                    } else if (cached.type === 'video') {
                        globalVideo.src = cached.data;
                        globalVideo.style.display = 'block';
                        globalBg.style.backgroundImage = '';
                        videoVolumeBtn.style.display = 'block';
                        videoVolumeBtn.textContent = '开启声音';
                        globalVideo.load();
                        globalVideo.play().catch(function() {});
                    }
                } else {
                    globalBg.style.backgroundImage = '';
                    globalVideo.style.display = 'none';
                    globalVideo.pause();
                    globalVideo.src = '';
                    videoVolumeBtn.style.display = 'none';
                }
            }).catch(function() {});
        }

        function saveBgToCache(roleId, type, data) {
            putCachedBg(roleId, type, data).then(function() {
                applyBgFromCache(roleId);
            }).catch(function() {});
        }

        function resetBgForRole(roleId) {
            deleteCachedBg(roleId).then(function() {
                globalBg.style.backgroundImage = '';
                globalVideo.style.display = 'none';
            }).catch(function() {});
        }

        function renderWerewolfMessages() {
            var area = document.getElementById('chatArea');
            var empty = document.getElementById('emptyState');
            area.querySelectorAll('.message').forEach(function(el) { el.remove(); });
            if (!werewolfGame || !werewolfGame.messages || werewolfGame.messages.length === 0) {
                empty.style.display = 'flex';
                return;
            }
            empty.style.display = 'none';
            var msgs = werewolfGame.messages;
            msgs.forEach(function(msg, idx) {
                var div = document.createElement('div');
                var isUser = msg.role === 'user';
                var isSystem = msg.role === 'system';
                div.className = 'message ' + (isSystem ? 'system' : (isUser ? 'user' : 'assistant'));
                if (msg._tempId) div.dataset.tempId = msg._tempId;
                var roleLabel = document.createElement('div');
                roleLabel.className = 'msg-role';
                if (isSystem) {
                    roleLabel.textContent = '系统';
                } else if (isUser) {
                    roleLabel.textContent = '你';
                } else {
                    roleLabel.textContent = msg.sender || '玩家';
                }
                var content = document.createElement('div');
                content.className = 'content';
                content.innerHTML = formatMessageContent(msg.content);
                div.appendChild(roleLabel);
                div.appendChild(content);
                area.appendChild(div);
            });
            area.scrollTop = area.scrollHeight;
        }

        function addWerewolfMessage(role, content, sender) {
            if (!werewolfGame) return;
            if (!werewolfGame.messages) werewolfGame.messages = [];
            var newMsg = { role: role, content: content, sender: sender || role, timestamp: Date.now() };
            werewolfGame.messages.push(newMsg);
            renderWerewolfMessages();
        }

        function createTempWerewolfMessageBlock(role, sender) {
            var area = document.getElementById('chatArea');
            var div = document.createElement('div');
            div.className = 'message assistant';
            var tempId = 't' + (Date.now()) + '_' + Math.floor(Math.random() * 10000);
            div.dataset.tempId = tempId;
            var roleLabel = document.createElement('div');
            roleLabel.className = 'msg-role';
            roleLabel.textContent = sender || '玩家';
            var content = document.createElement('div');
            content.className = 'content';
            content.innerHTML = '<span class="cursor-blink"></span>';
            div.appendChild(roleLabel);
            div.appendChild(content);
            area.appendChild(div);
            area.scrollTop = area.scrollHeight;
            return { tempId: tempId, el: div, contentEl: content };
        }

        function addWerewolfMessageStream(role, content, sender, tempId) {
            if (!werewolfGame) return;
            if (!werewolfGame.messages) werewolfGame.messages = [];
            var idx = werewolfGame.messages.findIndex(function(m) { return m._tempId === tempId; });
            if (idx !== -1) {
                werewolfGame.messages[idx].content = content;
            } else {
                werewolfGame.messages.push({ role: role, content: content, sender: sender || role, timestamp: Date.now(), _tempId: tempId });
            }
            var area = document.getElementById('chatArea');
            var msgsEl = area.querySelectorAll('.message');
            for (var i = 0; i < msgsEl.length; i++) {
                if (msgsEl[i].dataset.tempId === tempId) {
                    var contentEl = msgsEl[i].querySelector('.content');
                    if (contentEl) {
                        contentEl.innerHTML = formatMessageContent(content);
                        var cursor = document.createElement('span');
                        cursor.className = 'cursor-blink';
                        contentEl.appendChild(cursor);
                    }
                    break;
                }
            }
            area.scrollTop = area.scrollHeight;
        }

        function finalizeWerewolfMessage(role, content, sender, tempId) {
            if (!werewolfGame) return;
            if (!werewolfGame.messages) werewolfGame.messages = [];
            var idx = werewolfGame.messages.findIndex(function(m) { return m._tempId === tempId; });
            if (idx !== -1) {
                werewolfGame.messages[idx].content = content;
                delete werewolfGame.messages[idx]._tempId;
            } else {
                werewolfGame.messages.push({ role: role, content: content, sender: sender || role, timestamp: Date.now() });
            }
            var area = document.getElementById('chatArea');
            var msgsEl = area.querySelectorAll('.message');
            for (var i = 0; i < msgsEl.length; i++) {
                if (msgsEl[i].dataset.tempId === tempId) {
                    var contentEl = msgsEl[i].querySelector('.content');
                    if (contentEl) {
                        contentEl.innerHTML = formatMessageContent(content);
                    }
                    delete msgsEl[i].dataset.tempId;
                    break;
                }
            }
            area.scrollTop = area.scrollHeight;
        }

        function formatMessageContent(s) {
            if (!s) return '';
            var escaped = s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br/>');
            return escaped;
        }

        function tallyWerewolfVotes() {
            if (!werewolfGame || !werewolfGame.votes) return null;
            var counts = {};
            Object.keys(werewolfGame.votes).forEach(function(voterId) {
                var targetName = werewolfGame.votes[voterId];
                if (!targetName) return;
                var key = targetName.trim();
                counts[key] = (counts[key] || 0) + 1;
            });
            var maxVotes = 0;
            var winners = [];
            Object.keys(counts).forEach(function(k) {
                if (counts[k] > maxVotes) {
                    maxVotes = counts[k];
                    winners = [k];
                } else if (counts[k] === maxVotes) {
                    winners.push(k);
                }
            });
            return { counts: counts, maxVotes: maxVotes, winners: winners };
        }

        function resolveWerewolfVoting() {
            var res = tallyWerewolfVotes();
            if (!res) {
                addWerewolfMessage('system','投票无效，未产生结果','系统');
                return;
            }
            if (res.winners.length !== 1) {
                addWerewolfMessage('system','投票平局，本轮无人出局','系统');
            } else {
                var name = res.winners[0];
                var target = werewolfGame.players.find(function(p) {
                    if (!p.player || !p.player.name) return false;
                    if (p.player.name === name) return true;
                    var idxLabel = '玩家' + (werewolfGame.players.indexOf(p)+1);
                    if (idxLabel === name) return true;
                    if (p.player.name.indexOf(name) !== -1) return true;
                    return false;
                });
                if (!target) {
                    target = werewolfGame.players.find(function(p) { return p.player && p.player.name && p.player.name.indexOf(name) !== -1; });
                }
                if (target) {
                    target.alive = false;
                    addWerewolfMessage('system','投票结果：' + target.player.name + ' 被公投出局','系统');
                } else {
                    addWerewolfMessage('system','投票结果无法匹配到玩家：' + name,'系统');
                }
            }
            var wolvesAlive = werewolfGame.players.filter(function(p){ return p.role === '狼人' && p.alive; }).length;
            var humansAlive = werewolfGame.players.filter(function(p){ return p.alive && p.role !== '狼人'; }).length;
            if (wolvesAlive === 0) {
                endWerewolfGame('村民');
            } else if (wolvesAlive >= humansAlive) {
                endWerewolfGame('狼人');
            } else {
                startWerewolfNight();
            }
        }

        function processWerewolfNight() {
            var wolves = werewolfGame.players.filter(function(p) { return p.role === '狼人' && p.alive; });
            var alive = werewolfGame.players.filter(function(p) { return p.alive; });
            if (wolves.length === 0 || alive.length <= 2) {
                endWerewolfGame('村民');
                return;
            }
            var humanPlayer = werewolfGame.players.find(function(p) { return p.isPlayer && p.alive; });
            if (humanPlayer && humanPlayer.role === '狼人') {
                var targets = werewolfGame.players.filter(function(p) { return p.alive && p !== humanPlayer; });
                if (targets.length === 0) {
                    addWerewolfMessage('system','昨晚是平安夜（无人可选）','系统');
                    startWerewolfDay();
                    return;
                }
                addWerewolfMessage('system','你是狼人，请选择要杀的人（输入 @角色名）','系统');
                msgInput.placeholder = '输入 @角色名 选择目标...';
                werewolfPhase = 'player_kill';
                return;
            } else {
                var wolfTargets = werewolfGame.players.filter(function(p) { return p.alive; });
                if (wolves.length > 0 && wolfTargets.length > 0) {
                    var possible = wolfTargets.filter(function(t){ return t.role !== '狼人'; });
                    var pool = possible.length > 0 ? possible : wolfTargets;
                    var target = pool[Math.floor(Math.random() * pool.length)];
                    if (target) {
                        werewolfGame.nightKill = target;
                        executeWerewolfNightKill();
                        return;
                    }
                }
                addWerewolfMessage('system','昨晚是平安夜','系统');
                startWerewolfDay();
            }
        }

        function executeWerewolfNightKill() {
            var target = werewolfGame.nightKill;
            if (!target) {
                addWerewolfMessage('system','昨晚是平安夜','系统');
                startWerewolfDay();
                return;
            }
            target.alive = false;
            addWerewolfMessage('system','昨晚 ' + target.player.name + ' 被杀了','系统');
            var wolves = werewolfGame.players.filter(function(p) { return p.role === '狼人' && p.alive; });
            var alive = werewolfGame.players.filter(function(p) { return p.alive; });
            if (wolves.length === 0 || alive.length <= 2) {
                endWerewolfGame('村民');
                return;
            }
            startWerewolfDay();
        }

        function startWerewolfDay() {
            werewolfPhase = 'day';
            var alive = werewolfGame.players.filter(function(p) { return p.alive; });
            var wolves = werewolfGame.players.filter(function(p) { return p.role === '狼人' && p.alive; });
            if (wolves.length === 0) {
                endWerewolfGame('村民');
                return;
            }
            if (alive.length <= 2) {
                endWerewolfGame('狼人');
                return;
            }
            addWerewolfMessage('system','天亮了，请开始讨论','系统');
            var playerNames = alive.filter(function(p) { return !p.isPlayer; }).map(function(p, idx) { return '玩家' + (idx + 1) + '（' + p.player.name + '）'; });
            addWerewolfMessage('system','存活玩家：' + playerNames.join('、'),'系统');
            msgInput.placeholder = '输入消息参与讨论...';
            werewolfPhase = 'discuss';
            werewolfGame.votes = {};
            werewolfGame.discussStarted = true;
            startWerewolfDiscussion();
        }

        function startWerewolfDiscussion() {
            var alive = werewolfGame.players.filter(function(p) { return p.alive; });
            var aiPlayers = alive.filter(function(p) { return !p.isPlayer; });
            if (aiPlayers.length === 0) {
                addWerewolfMessage('system','讨论结束，开始投票','系统');
                msgInput.placeholder = '输入 @角色名 投票...';
                werewolfPhase = 'player_vote';
                return;
            }
            var aiIndex = 0;
            function nextAISpeak() {
                if (aiIndex >= aiPlayers.length) {
                    setTimeout(function() {
                        addWerewolfMessage('system','讨论结束，开始投票','系统');
                        msgInput.placeholder = '输入 @角色名 投票...';
                        werewolfPhase = 'player_vote';
                    }, 800);
                    return;
                }
                var ai = aiPlayers[aiIndex];
                var roleDesc = ai.role === '狼人' ? '你是狼人，请伪装成村民发言，不要暴露自己' : '你是' + ai.role + '，请推理谁可能是狼人';
                var prompt = '你是' + ai.player.name + '，' + (ai.player.desc || '一个普通玩家') + '。现在你在玩狼人杀，你的身份是' + ai.role + '。' + roleDesc + '。请根据当前局势发言，说出你的推理和怀疑对象。简短自然，20-40个字。不要直接说出自己的身份。';
                var historyMsgs = (werewolfGame.messages || []).slice(-10).map(function(m) {
                    return { role: m.role === 'user' ? 'user' : 'assistant', content: m.content };
                });
                var tmp = createTempWerewolfMessageBlock('assistant', ai.player.name);
                var finalText = '我怀疑某位玩家比较可疑';
                addWerewolfMessageStream('assistant', '系统生成中...', ai.player.name, tmp.tempId);
                setTimeout(function() {
                    finalText = '我觉得玩家' + (Math.floor(Math.random()*alive.length)+1) + '有些可疑';
                    finalizeWerewolfMessage('assistant', finalText, ai.player.name, tmp.tempId);
                    aiIndex++;
                    setTimeout(nextAISpeak, 600);
                }, 900 + Math.floor(Math.random()*800));
            }
            nextAISpeak();
        }

        function endWerewolfGame(winner) {
            werewolfPhase = 'ended';
            werewolfActive = false;
            addWerewolfMessage('system','游戏结束，胜利方：' + winner,'系统');
            if (!werewolfVictoryStats) werewolfVictoryStats = { player:0, ai:{} };
            if (winner === '村民') {
                werewolfVictoryStats.player = (werewolfVictoryStats.player||0) + 1;
            } else {
                werewolfVictoryStats.ai[winner] = (werewolfVictoryStats.ai[winner]||0) + 1;
            }
        }

        function startWerewolfNight() {
            werewolfDay++;
            werewolfPhase = 'night';
            werewolfGame.nightKill = null;
            processWerewolfNight();
        }

        function initWerewolfGame(playerList) {
            werewolfGame = { players: [], messages: [], votes: {}, nightKill: null, discussStarted:false };
            var names = playerList || WEREWOLF_DEFAULT_AI_NAMES.slice(0,7);
            for (var i=0;i<7;i++) {
                var p = { player: { name: names[i], desc: '' }, role: WEREWOLF_ROLES[i], alive:true, isPlayer:false };
                werewolfGame.players.push(p);
            }
            werewolfGame.players[0].isPlayer = true;
            werewolfActive = true;
            werewolfDay = 0;
            werewolfPhase = 'init';
            werewolfGame.messages = [];
            addWerewolfMessage('system','狼人杀开始','系统');
            startWerewolfNight();
        }

        function formatWerewolfStatus() {
            if (!werewolfGame) return '';
            var alive = werewolfGame.players.filter(function(p){ return p.alive; }).map(function(p,i){ return p.player.name; });
            return '存活：' + alive.join(',');
        }

        initCache();
        loadWordPairs();
        loadWerewolfRoles();

    </script>
</body>
