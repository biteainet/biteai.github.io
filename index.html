            background: linear-gradient(135deg, #6a3093, #a044ff);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* 容器 + 全局弹入动画 */
        .container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            /* 弹入动画 */
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #fff;
            font-size: 2.2rem;
            margin-bottom: 20px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.2);

            color: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
            line-height: 1.8;
            margin-bottom: 35px;
        }

        /* 下载按钮 */
        .download-btn {
            display: inline-block;
            background: #fff;
            color: #6a3093;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 16px 50px;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
        }

        /* 手机端适配 */
        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            h1 {
                font-size: 1.8rem;
            }
            .download-btn {
                width: 100%;
                padding: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>比特人工智能</h1>
