        function initVoiceRecognition() {
            var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) { return; }
            recognition = new SR();
            recognition.lang = 'zh-CN';
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.maxAlternatives = 1;
            recognition.onresult = function(event) {
                var final = '',
                    interim = '';
                for (var i = event.resultIndex; i < event.results.length; i++) {
                    var transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) final += transcript;
                    else interim += transcript;
                }
                if (final) { msgInput.value = final;
                    msgInput.dispatchEvent(new Event('input')); } else if (interim) { msgInput.value = interim;
                    msgInput.dispatchEvent(new Event('input')); }
            };
            recognition.onend = function() {
                if (isRecording) {
                    isRecording = false;
                    holdTalkBtn.classList.remove('recording');
                    holdTalkBtn.textContent = '按住说话';
                    if (cancelSend) { cancelSend = false;
                        holdTalkBtn.classList.remove('cancel'); return; }
                    if (msgInput.value.trim()) sendMessage();
                }
            };
            recognition.onerror = function(event) {
                if (event.error === 'not-allowed') {
                    alert('请允许浏览器访问麦克风权限');
                }
                if (isRecording) {
                    isRecording = false;
                    holdTalkBtn.classList.remove('recording');
                    holdTalkBtn.textContent = '按住说话';
                }
            };
        }

        function startRecording() {
            if (!recognition) return;
            if (recognition && recognition.listening) return;
            try {
                recognition.start();
                isRecording = true;
                holdTalkBtn.classList.add('recording');
                holdTalkBtn.textContent = '松开发送';
                cancelSend = false;
            } catch (e) {}
        }

        function stopRecording() {
            if (!recognition || !isRecording) return;
            try { recognition.stop(); } catch (e) {}
        }

        function cancelRecording() {
            if (recognition && recognition.listening) recognition.abort();
            isRecording = false;
            holdTalkBtn.classList.remove('recording', 'cancel');
            holdTalkBtn.textContent = '按住说话';
            msgInput.value = '';
            cancelSend = false;
        }

        document.addEventListener('keydown', function(e) {

        document.addEventListener('keyup', function(e) {
            if (e.key === ' ' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {

                                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + API_KEY },
                                body: JSON.stringify({
                                    model: model,
                                    messages: [{ role: 'system', content: prompt }],
                                    stream: true,
                                    max_tokens: 200,
                                    temperature: 0.95
                                })
                            }).then(function(resp) {
                                if (!resp.ok) throw new Error('API错误');
                                var reader = resp.body.getReader();
                                var decoder = new TextDecoder();
                                var buffer = '';
                                function read() {
                                    return reader.read().then(function(result) {
                                        if (result.done) return;
                                        buffer += decoder.decode(result.value, { stream: true });
                                        var lines = buffer.split('\n');
                                        buffer = lines.pop() || '';
                                        for (var i = 0; i < lines.length; i++) {
                                            if (!lines[i].startsWith('data: ')) continue;
                                            var data = lines[i].slice(6).trim();
                                            if (data === '[DONE]') continue;
                                            try {
                                                var json = JSON.parse(data);
                                                var delta = json.choices ? json.choices[0].delta : null;
                                                if (delta && delta.content) {
                                                    fullContent += delta.content;
                                                    content.textContent = fullContent;
                                                    content.appendChild(cursor);
                                                    area.scrollTop = area.scrollHeight;
                                                }
                                            } catch (e) {}
                                        }
                                        return read();
                                    });
                                }
                                return read().then(function() {
                                    var finalDesc = fullContent.trim();
                                    if (!finalDesc || finalDesc.length < 2) {
                                        var fallbackItems = ['这个物品挺普通的', '嗯，还行吧', '说不上来', '一般般', '凑合吧'];
                                        finalDesc = fallbackItems[Math.floor(Math.random() * fallbackItems.length)];
                                    }
                                    game.descriptions[ai.id] = finalDesc;
                                    tempDiv.remove();
                                    addGroupMessage(groupChatActiveId, 'assistant', finalDesc, ai.name);
                                    renderGroupMessages(groupChatActiveId);
                                    aiIndex++;
                                    setTimeout(nextAI, 600);
                                });
                            }).catch(function() {
                                var fallbackItems = ['这个物品挺普通的', '嗯，还行吧', '说不上来', '一般般', '凑合吧'];
                                var fallback = fallbackItems[Math.floor(Math.random() * fallbackItems.length)];
                                game.descriptions[ai.id] = fallback;
                                tempDiv.remove();
                                addGroupMessage(groupChatActiveId, 'assistant', fallback, ai.name);
                                renderGroupMessages(groupChatActiveId);
                                aiIndex++;
                                setTimeout(nextAI, 600);
                            });
                        }
                        nextAI();
                        return;
                    }
                }
                if (game.phase === 'voting') {
                    var text = msgInput.value.trim();
                    if (!text) return;
                    msgInput.value = '';
                    handleUndercoverVote(text);
                    return;
                }
            }
            sendMessage();
        });

        function init() {
            loadWordPairs().then(function() {
                initCache();
                loadData();
                renderAll();
                initVoiceRecognition();
                initMusic();
                msgInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); }
                });
                msgInput.addEventListener('input', function() {
                    msgInput.style.height = 'auto';
                    msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
                });
                document.getElementById('clearHistoryBtn').addEventListener('click', clearCurrentChatHistory);
                document.getElementById('modelSelect').addEventListener('change', saveData);
                document.addEventListener('selectstart', function(e) { e.preventDefault(); });
                document.addEventListener('dragstart', function(e) { e.preventDefault(); });
                document.getElementById('avatarInput').addEventListener('change', function(e) {
                    var file = e.target.files[0];
                    if (!file || !avatarInputRoleId) return;
                    var reader = new FileReader();
                    reader.onload = function(ev) {
                        var role = getRole(avatarInputRoleId);
                        if (role) { role.avatar = ev.target.result;
                            saveData();
                            renderRoles(); }
                        avatarInputRoleId = null;
                    };
                    reader.readAsDataURL(file);
                    this.value = '';
                });
                window.addEventListener('resize', function() {
                    var area = document.getElementById('chatArea');
                    area.scrollTop = area.scrollHeight;
                    if (window.innerWidth > 768) { sidebar.classList.remove('show');
                        sidebarMask.classList.remove('show'); }
                });
                globalVideo.addEventListener('loadeddata', function() {
                    if (!globalVideo.muted) globalVideo.play().catch(function() {});
                });
                presetMusicFileInput.addEventListener('change', function(e) {
                    var file = e.target.files[0];
                    if (!file) return;
                    var path = 'file://' + (file.path || file.name);
                    presetMusicPath.value = path;
                    presetMusicStatus.textContent = '已选择: ' + file.name;
                    presetMusicStatus.style.color = 'rgba(100,200,150,0.8)';
                    this.value = '';
                });
            });
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
